services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      platforms:
        - "linux/amd64"
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nicepfp}
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_HOST=${NEXT_PUBLIC_HOST:-http://localhost:3000}
      - PINATA_API_JWT=${PINATA_API_JWT}
      - PRIVATE_KEY=${PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nicepfp-network
    restart: unless-stopped
    labels:
      - traefik.http.services.http-0-o337y6edj3hvclcpzdombee2-web.loadbalancer.server.port=3000

  generate-image:
    build:
      context: .
      dockerfile: apps/generate_image/Dockerfile
      platforms:
        - "linux/amd64"
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nicepfp}
      - REDIS_URL=redis://redis:6379
      - PRIVATE_KEY=${PRIVATE_KEY}
      - PINATA_API_JWT=${PINATA_API_JWT}
      - BROWSERLESS_URL=${BROWSERLESS_URL:-ws://browserless:3000}
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN}
      - WEB_URL=${WEB_URL:-http://web:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      browserless:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nicepfp-network
    restart: unless-stopped

  mint:
    build:
      context: .
      dockerfile: apps/mint/Dockerfile
      platforms:
        - "linux/amd64"
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nicepfp}
      - REDIS_URL=redis://redis:6379
      - PRIVATE_KEY=${PRIVATE_KEY}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nicepfp-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: packages/database/migrate.Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nicepfp}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nicepfp-network
    restart: "no"

  redis:
    image: redis:alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - nicepfp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-nicepfp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nicepfp-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-nicepfp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  browserless:
    image: ghcr.io/browserless/chromium:v2.57.2
    expose:
      - "3000"
    environment:
      TOKEN: ${BROWSERLESS_TOKEN}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - "http://127.0.0.1:3000/docs"
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - nicepfp-network

networks:
  nicepfp-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
