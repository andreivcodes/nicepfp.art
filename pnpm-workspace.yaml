packages:
  - apps/*
  - packages/*

# Required for pnpm deploy to work with workspace dependencies
injectWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild
  - keccak
  - puppeteer
  - react-p5
  - secp256k1
  - sharp

# Patched versions of vulnerable transitive dependencies (pnpm audit --prod):
# protobufjs decodes client-supplied Farcaster frame messages (frames.js),
# elliptic / secp256k1 sign with the mint key (eth-crypto > eccrypto).
overrides:
  protobufjs@<7.6.1: ^7.6.1
  elliptic@<6.6.1: ^6.6.1
  secp256k1@<3.8.1: ^3.8.1
